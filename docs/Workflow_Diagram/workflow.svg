<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1550" viewBox="0 0 1200 1550" role="img" aria-labelledby="title desc"><title id="title">Golden Eagle Flight Plan user workflow</title><desc id="desc">Open the app and sign in. Retry if sign-in fails. The account opens a student or faculty dashboard. Follow the permitted student or faculty activities. The app checks access and handles saved information, then shows results.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#667085" /></marker></defs><rect width="1200" height="1610" fill="white" /><style>text{font-family:Arial,Helvetica,sans-serif;fill:#253047}.title{font-size:29px;font-weight:700}.sub{font-size:17px;fill:#667085}.box{font-size:19px}.small{font-size:16px;fill:#667085}.lane{font-size:18px;font-weight:700}.line{fill:none;stroke:#667085;stroke-width:2;marker-end:url(#arrow)}</style><text x="60" y="58" class="title">Golden Eagle Flight Plan</text><rect x="440" y="130" width="320" height="56" rx="28" fill="#dff1e6" stroke="#92b69e" stroke-width="1.4" /><text x="600.0" y="158.0" text-anchor="middle" dominant-baseline="middle" class="box">Open the app</text><path d="M600 186 V221" class="line" /><rect x="400" y="221" width="400" height="70" rx="10" fill="#f5f6f8" stroke="#c6ccd5" stroke-width="1.4" /><text x="600.0" y="256.0" text-anchor="middle" dominant-baseline="middle" class="box">Sign in or create an account</text><path d="M600 291 V326" class="line" /><path d="M600 326 L740 390 L600 454 L460 390 Z" fill="#fff3ce" stroke="#d7be78" stroke-width="1.4" /><text x="600" y="377.5" text-anchor="middle" dominant-baseline="middle" class="box">Sign-in</text><text x="600" y="402.5" text-anchor="middle" dominant-baseline="middle" class="box">successful?</text><path d="M740 390 H960 V279" class="line" /><text x="811" y="373.0" text-anchor="middle" dominant-baseline="middle" class="small">No</text><rect x="850" y="209" width="290" height="70" rx="10" fill="#fff5ed" stroke="#dfbea3" stroke-width="1.4" /><text x="995.0" y="231.5" text-anchor="middle" dominant-baseline="middle" class="box">Check your details</text><text x="995.0" y="256.5" text-anchor="middle" dominant-baseline="middle" class="box">and try again</text><path d="M850 244 H800" class="line" /><path d="M600 454 V500" class="line" /><text x="624" y="477.0" text-anchor="middle" dominant-baseline="middle" class="small">Yes</text><rect x="365" y="500" width="470" height="70" rx="10" fill="#f5f6f8" stroke="#c6ccd5" stroke-width="1.4" /><text x="600.0" y="535.0" text-anchor="middle" dominant-baseline="middle" class="box">Your account opens the right dashboard</text><rect x="60" y="610" width="510" height="397" rx="16" fill="#f2f7fd" /><rect x="630" y="610" width="510" height="397" rx="16" fill="#f8f3fb" /><text x="170" y="641.0" text-anchor="middle" dominant-baseline="middle" class="lane">STUDENT</text><text x="740" y="641.0" text-anchor="middle" dominant-baseline="middle" class="lane">FACULTY</text><path d="M475 570 V590 H315 V674" class="line" /><path d="M725 570 V590 H885 V674" class="line" /><rect x="100" y="674" width="430" height="76" rx="10" fill="#e0edfc" stroke="#9bb7da" stroke-width="1.4" /><text x="315.0" y="712.0" text-anchor="middle" dominant-baseline="middle" class="box">Open your profile</text><path d="M315 750 V786" class="line" /><rect x="100" y="786" width="430" height="76" rx="10" fill="#e0edfc" stroke="#9bb7da" stroke-width="1.4" /><text x="315.0" y="811.5" text-anchor="middle" dominant-baseline="middle" class="box">Enter your major, year, and</text><text x="315.0" y="836.5" text-anchor="middle" dominant-baseline="middle" class="box">interests</text><path d="M315 862 V898" class="line" /><rect x="100" y="898" width="430" height="76" rx="10" fill="#e0edfc" stroke="#9bb7da" stroke-width="1.4" /><text x="315.0" y="936.0" text-anchor="middle" dominant-baseline="middle" class="box">Save your profile</text><rect x="670" y="674" width="430" height="76" rx="10" fill="#eee3f6" stroke="#bba2cc" stroke-width="1.4" /><text x="885.0" y="712.0" text-anchor="middle" dominant-baseline="middle" class="box">Open your faculty dashboard</text><path d="M885 750 V786" class="line" /><rect x="670" y="786" width="430" height="76" rx="10" fill="#eee3f6" stroke="#bba2cc" stroke-width="1.4" /><text x="885.0" y="824.0" text-anchor="middle" dominant-baseline="middle" class="box">Review your account details</text><path d="M885 862 V898" class="line" /><rect x="670" y="898" width="430" height="76" rx="10" fill="#eee3f6" stroke="#bba2cc" stroke-width="1.4" /><text x="885.0" y="936.0" text-anchor="middle" dominant-baseline="middle" class="box">Update your own profile</text><path d="M315 974 V1038 H600 V1076" class="line" /><path d="M885 974 V1038 H600 V1076" class="line" /><rect x="300" y="1076" width="600" height="88" rx="10" fill="#f5f6f8" stroke="#c6ccd5" stroke-width="1.4" /><text x="600.0" y="1107.5" text-anchor="middle" dominant-baseline="middle" class="box">The app checks what you can access</text><text x="600.0" y="1132.5" text-anchor="middle" dominant-baseline="middle" class="box">and handles your request</text><path d="M600 1164 V1205" class="line" /><text x="747" y="1187.0" text-anchor="middle" dominant-baseline="middle" class="small">Read or save information</text><rect x="325" y="1207" width="550" height="107" rx="10" fill="#fff5d9" stroke="#ccb77e" stroke-width="1.4" /><text x="600" y="1250.5" text-anchor="middle" dominant-baseline="middle" class="small">Saved information</text><text x="600" y="1273.5" text-anchor="middle" dominant-baseline="middle" class="small">Account details and profiles</text><path d="M600 1314 V1350" class="line" /><rect x="255" y="1350" width="690" height="84" rx="10" fill="#f5f6f8" stroke="#c6ccd5" stroke-width="1.4" /><text x="600.0" y="1392.0" text-anchor="middle" dominant-baseline="middle" class="box">Your updated profile appears</text><path d="M600 1434 V1472" class="line" /><rect x="440" y="1472" width="320" height="56" rx="28" fill="#dff1e6" stroke="#92b69e" stroke-width="1.4" /><text x="600.0" y="1500.0" text-anchor="middle" dominant-baseline="middle" class="box">Sign out when finished</text></svg>